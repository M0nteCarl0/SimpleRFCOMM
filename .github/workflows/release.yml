name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'release*'
      - 'v*'
      - '*release*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release (for manual test runs)'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Custom Tag / Release Name (optional)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            archive_ext: zip
          - os: ubuntu-latest
            platform: linux
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libbluetooth-dev bluez ninja-build

      - name: Compute package ref name
        shell: bash
        run: |
          REF_NAME="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            REF_NAME="${{ inputs.tag_name }}"
          fi
          SAFE_REF=$(echo "$REF_NAME" | sed 's/[^a-zA-Z0-9._-]/_/g')
          echo "SAFE_REF=${SAFE_REF}" >> $GITHUB_ENV

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build project
        run: |
          cmake --build build --config Release --parallel

      - name: Package artifacts
        shell: bash
        run: |
          PKG_NAME="SimpleRFCOMM-${SAFE_REF}-${{ matrix.platform }}-x64"
          echo "Staging files into ${PKG_NAME}..."

          # Install binaries, static library, and headers
          cmake --install build --config Release --prefix "${PKG_NAME}"

          # Copy documentation into package root
          cmake -E copy README.md API_GUIDE.md INSTALL.md "${PKG_NAME}/"

          # Create compressed package
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cmake -E tar cfv "${PKG_NAME}.zip" --format=zip "${PKG_NAME}"
          else
            cmake -E tar czfv "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleRFCOMM-${{ env.SAFE_REF }}-${{ matrix.platform }}-x64
          path: SimpleRFCOMM-${{ env.SAFE_REF }}-${{ matrix.platform }}-x64.${{ matrix.archive_ext }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate SHA256 Checksums
        shell: bash
        run: |
          cd release_assets
          echo "Downloaded assets:"
          ls -la
          sha256sum SimpleRFCOMM-* > SHA256SUMS.txt
          echo "Calculated Checksums:"
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'Release' }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'release' }}
          files: |
            release_assets/SimpleRFCOMM-*
            release_assets/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
